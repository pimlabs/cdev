name: shellcheck

on:
  push:
  pull_request:

# A new push supersedes whatever the same branch already has in flight,
# rather than letting an old, possibly-stuck run keep burning minutes
# alongside the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # A run of this job normally finishes in under a minute. Without an
    # explicit cap, GitHub's default job timeout is 6 hours, so a step that
    # hangs (an apt mirror stall killed one run for 4 hours on 19 August
    # 2026, on a private repo, where that time is billable) keeps a runner
    # tied up and the meter running for the whole 6 hours unless someone
    # notices and cancels it by hand.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: find . -name "*.sh" -exec shellcheck {} +
